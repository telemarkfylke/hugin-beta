# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - TEST

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: 'tfkdlzchataimugin2web' # set this to your function or web app name
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '22.x' # set this to the node version to use (supports 8.x, 10.x, 12.x)

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 'Install dependencies'
        shell: bash
        run: npm ci

      - name: 'Lint and type check'
        shell: bash
        run: npx tsc --noEmit && npx @biomejs/biome check

      - name: 'Build'
        shell: bash
        run: npm run build

      - name: 'Run unit tests'
        shell: bash
        run: npm run test:unit -- --run

      - name: 'Check Kudu SCM connectivity'
        shell: bash
        run: |
          SCM_HOST="${{ env.APP_NAME }}.scm.azurewebsites.net"
          echo "Resolving $SCM_HOST..."
          getent hosts "$SCM_HOST" || nslookup "$SCM_HOST" || echo "DNS resolution failed"
          echo "Curling https://$SCM_HOST/api/settings (expect 401 if reachable, auth aside)..."
          curl -v --max-time 20 -o /dev/null -w "\nHTTP status: %{http_code}\nTotal time: %{time_total}s\n" "https://$SCM_HOST/api/settings" || echo "Curl failed to connect"
      - name: Trace Route to SCM Private Endpoint
        run: |
          TARGET_IP="10.205.14.138"
          
          echo "=== 1. Trace TCP route to 10.205.14.138:443 ==="
          # Installs traceroute if missing and traces on TCP port 443
          sudo apt-get update && sudo apt-get install -y traceroute
          sudo traceroute -T -p 443 $TARGET_IP || true
      
          echo "=== 2. Check local interface & routing table ==="
          ip route get $TARGET_IP
          
      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ env.APP_NAME }} # set this to your function or web app name
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_TEST }}
