- name: SCM reachability
        run: |
          host="tfkdlzchataimugin2web.scm.azurewebsites.net"
          echo "--- DNS ---"
          getent hosts "$host" || echo "DNS resolution FAILED"
          echo "--- HTTPS ---"
          curl -sS -o /dev/null -w 'http_code=%{http_code} time=%{time_total}\n' \
            --max-time 20 "https://$host/api/settings" || echo "connection FAILED"
